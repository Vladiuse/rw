server {
    listen 80;
    server_name rw.sladkievody.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rw.sladkievody.com;

    include /etc/nginx/cloudflare-real-ip.conf;


    ssl_certificate     /etc/nginx/ssl/sladkievody.pem;
    ssl_certificate_key /etc/nginx/ssl/sladkievody.key;

    client_max_body_size 20m;

    access_log /var/log/nginx/rw.sladkievody.access.log;
    error_log  /var/log/nginx/rw.sladkievody.error.log;

    location /static/ {
        alias /srv/rw/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/rw/rw/media/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }
}
